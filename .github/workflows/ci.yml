name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:auth
      - run: pnpm test:e2e:production
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          if-no-files-found: ignore
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm supabase:start > /tmp/easy-learn-supabase.log 2>&1
      - run: pnpm exec supabase test db
      - run: pnpm test:cloud
      - run: pnpm test:cloud:browser
      - run: pnpm test:cloud:delete
      - run: pnpm test:cloud:cleanup
      - run: pnpm supabase:stop
        if: always()
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cloud-browser-failure-traces
          path: test-results-cloud/
          if-no-files-found: ignore
