project_id = "easy-learn"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "3MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/callback", "http://127.0.0.1:5173/auth/callback?type=recovery", "http://127.0.0.1:4173/auth/callback", "http://127.0.0.1:4173/auth/callback?type=recovery", "http://127.0.0.1:4175/auth/callback", "http://127.0.0.1:4175/auth/callback?type=recovery"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
[functions.delete-account]
verify_jwt = false
[auth.rate_limit]
email_sent = 1000
[functions.cleanup-images]
verify_jwt = false
